name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          mise_toml: |
            [tools]
            rust = { version = "1.99", components = "clippy,rustfmt", targets = "thumbv7em-none-eabihf" }
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Link without a global allocator
        env:
          RUSTFLAGS: "-C panic=abort -C link-arg=-esplice_probe"
        run: cargo build --target thumbv7em-none-eabihf --example no_allocator
